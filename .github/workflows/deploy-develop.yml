name: Deploy to EC2 via Docker Hub

on:
  push:
    branches:
      - develop

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mait-ai-dev

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Docker Buildx 세팅
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ 캐시 이미지 확보 (처음엔 없을 수도 있으므로 무시)
      - name: Ensure build cache exists
        run: docker pull ${{ env.DOCKER_IMAGE }}:buildcache || true

      # 5️⃣ Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      # 5️⃣-1 DDNS → Public DNS로 IP 조회
      - name: Resolve DDNS host to IP (public DNS)
        id: resolve_dev_host
        run: |
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y dnsutils
          fi

          HOST="${{ secrets.DEV_SERVER_HOST }}"
          IP="$(dig @1.1.1.1 +short "${HOST}" | head -n 1)"
          if [ -z "${IP}" ]; then
            IP="$(dig @8.8.8.8 +short "${HOST}" | head -n 1)"
          fi

          if [ -z "${IP}" ]; then
            echo "❌ DDNS 호스트에서 IP를 찾지 못했습니다: ${HOST}"
            exit 1
          fi

          echo "✅ resolved_ip=${IP}"
          echo "ip=${IP}" >> "${GITHUB_OUTPUT}"

      # 6️⃣ EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ steps.resolve_dev_host.outputs.ip }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_PRIVATE_KEY }}
          script: |
            echo "🚀 배포 시작..."

            # 기존 컨테이너 중지 및 제거
            docker stop mait-ai || true
            docker rm mait-ai || true
            
            # 최신 이미지 pull
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            
            # 새 컨테이너 실행 (GitHub Secrets에서 환경변수 주입)
            docker run -d \
              --name mait-ai \
              -p 8000:8000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_DEFAULT_REGION="ap-northeast-2" \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest

            # 이전 이미지 정리 (24시간 지난 dangling 이미지만 삭제)
            docker image prune -f --filter "until=24h"

            echo "✅ 새 컨테이너 실행 완료!"

      # 7️⃣ 배포 검증
      - name: Verify deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ steps.resolve_dev_host.outputs.ip }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_PRIVATE_KEY }}
          script: |
            echo "⏳ 서버 시작 대기 중..."
            sleep 10

            echo ""
            echo "📦 실행 중인 컨테이너:"
            docker ps | grep mait-ai

            echo ""
            echo "📋 컨테이너 로그 (최근 30줄):"
            docker logs --tail 30 mait-ai

            echo ""
            echo "🏥 헬스 체크:"
            if curl -f ${{ secrets.DEV_AI_BASE_URL }}/api/ai/health; then
              echo "✅ 헬스 체크 성공!"
            else
              echo "⚠️ 헬스 체크 실패"
              exit 1
            fi

            # 주석: 향후 개선
            # - 헬스체크를 3회 반복 시도하도록 개선 가능 (ex: for i in {1..5}; do curl ...)
            
